server {
    listen 80;
    server_name _;

    # React/Vite build output
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the Django backend container
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;  # medical report uploads (PDF/images)
    }

    # Proxy uploaded media (report files) to the backend container
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
    }

    # SPA routing — send unmatched paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}